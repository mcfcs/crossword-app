<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#2b74e7"/>
  <!-- puzzle card -->
  <rect x="106" y="106" width="300" height="300" fill="#ffffff" stroke="#1a1a1a" stroke-width="12"/>
  <!-- grid lines (3x3) -->
  <g stroke="#1a1a1a" stroke-width="7">
    <line x1="206" y1="106" x2="206" y2="406"/>
    <line x1="306" y1="106" x2="306" y2="406"/>
    <line x1="106" y1="206" x2="406" y2="206"/>
    <line x1="106" y1="306" x2="406" y2="306"/>
  </g>
  <!-- block squares -->
  <rect x="306" y="106" width="100" height="100" fill="#1a1a1a"/>
  <rect x="106" y="306" width="100" height="100" fill="#1a1a1a"/>
  <!-- highlighted (selected) cell -->
  <rect x="206" y="206" width="100" height="100" fill="#ffd93b"/>
  <!-- letters -->
  <g fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="72" text-anchor="middle">
    <text x="156" y="182">K</text>
    <text x="256" y="282">R</text>
    <text x="356" y="382">O</text>
  </g>
</svg>
